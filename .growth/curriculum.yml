# 느슨한 흐름 (커리큘럼)
# - 카테고리마다 테마를 순서대로 진행해. 한 테마에서 5문제 풀면 다음 테마로.
# - 그 테마 안에서는 Claude가 자유롭게 골라. 가끔 자유 주제나 약점 복습으로 빠져.
# - 마지막 테마까지 가면 처음으로 돌아가서 다른 각도로 다시 나와.
# - 코테는 아래 백준 목록에서만 골라 (없는 문제 번호를 지어내지 않게).
# - 테마, 키워드, 문제는 마음대로 추가하거나 고쳐도 돼.
curriculum:
  categories:
    - category: CS
      themes:
        - name: 운영체제
          keywords: [프로세스와 스레드, 컨텍스트 스위칭, CPU 스케줄링, 뮤텍스와 세마포어, 데드락, 가상 메모리와 페이징, 캐시 지역성]
        - name: 네트워크
          keywords: [OSI 7계층, TCP와 UDP, 3-way handshake, HTTP 메서드와 상태 코드, HTTPS와 TLS, DNS, 로드 밸런서, 쿠키와 세션]
        - name: 데이터베이스
          keywords: [인덱스와 B+Tree, 클러스터드 인덱스, 실행 계획, 트랜잭션 ACID, 격리 수준, 락과 MVCC, 정규화와 반정규화, 옵티마이저]
        - name: 자료구조
          keywords: [해시 테이블과 충돌, 트리와 힙, 그래프, 스택과 큐 활용, 시간 복잡도]
        - name: 웹과 서버
          keywords: [웹 서버와 WAS, 스레드 풀, 동기와 비동기, 블로킹과 논블로킹, REST, CORS]
        - name: Java와 JVM
          keywords: [JVM 메모리 구조, GC, String 불변성, equals와 hashCode, 제네릭, synchronized와 volatile]

    - category: BACKEND
      themes:
        - name: Spring 핵심
          keywords: [IoC와 DI, 빈 생명주기, 빈 스코프, AOP, 프록시]
        - name: JPA 기본
          keywords: [영속성 컨텍스트, 1차 캐시, 더티 체킹, 엔티티 생명주기, flush]
        - name: JPA 성능
          keywords: [N+1 문제, fetch join, 지연 로딩과 즉시 로딩, batch size, 컬렉션 fetch join과 페이징, 벌크 연산]
        - name: 트랜잭션
          keywords: ["@Transactional 동작 원리", 전파 옵션, readOnly, 롤백 규칙, self-invocation 문제]
        - name: 인증과 인가
          keywords: [세션과 JWT, Access Token과 Refresh Token, Spring Security 필터 체인, 비밀번호 해시]
        - name: 캐시와 Redis
          keywords: [Look-aside 캐시, Write-through, TTL, 캐시 무효화, Redis 자료구조]
        - name: API 설계와 예외 처리
          keywords: [REST API 설계, 전역 예외 처리, "@Valid 검증", 응답 형식 통일, 페이징 API]
        - name: 테스트와 운영
          keywords: [단위 테스트와 통합 테스트, Mock, 로깅, HikariCP 커넥션 풀, 모니터링]

    - category: SECURITY
      themes:
        - name: 인젝션
          keywords: [SQL Injection, PreparedStatement, JPQL 인젝션, 명령어 인젝션]
        - name: XSS와 CSRF
          keywords: [Stored XSS, Reflected XSS, 출력 인코딩, CSRF 토큰, SameSite 쿠키]
        - name: 인증 취약점
          keywords: [비밀번호 저장과 BCrypt, 브루트포스와 Rate Limit, 세션 고정, JWT 탈취와 만료]
        - name: 인가 취약점
          keywords: [IDOR(남의 리소스 접근), 권한 체크 누락, 관리자 API 노출]
        - name: 설정과 정보 노출
          keywords: [CORS 설정 실수, 에러 메시지 노출, 시크릿 키 하드코딩, HTTPS]
        - name: 파일과 외부 요청
          keywords: [파일 업로드 취약점, 경로 조작, SSRF]

    - category: ARCHITECTURE
      themes:
        - name: 계층 구조 기초
          keywords: [레이어드 아키텍처, 도메인 모델, DTO와 엔티티 분리]
        - name: 읽기 성능
          keywords: [캐시 도입, 인덱스 설계, 읽기 전용 복제본(Replica)]
        - name: 쓰기와 동시성
          keywords: [재고 차감 동시성, 낙관적 락과 비관적 락, 분산 락, 중복 요청 방지(멱등성)]
        - name: 비동기와 이벤트
          keywords: [메시지 큐, 이벤트 기반 알림, 트랜잭션 아웃박스]
        - name: 확장성
          keywords: [수평 확장, 세션 저장소 분리, 샤딩, 파일 저장소 분리]
        - name: 장애 대응
          keywords: [타임아웃과 재시도, 서킷 브레이커, 외부 API 장애 격리]

    - category: CODE_REVIEW
      themes:
        - name: JPA 실수
          keywords: [N+1, LazyInitializationException, 엔티티 직접 반환, 연관관계 편의 메서드 누락]
        - name: 트랜잭션 실수
          keywords: [트랜잭션 누락, self-invocation, 트랜잭션 안에서 외부 API 호출, 체크 예외 롤백]
        - name: 예외와 검증
          keywords: [예외 삼키기, 입력 검증 누락, null 처리, 매직 넘버]
        - name: 동시성 실수
          keywords: [갱신 손실(Lost Update), 싱글톤 빈의 상태, 공유 컬렉션]
        - name: 보안 실수
          keywords: [권한 체크 누락, SQL 문자열 조합, 민감 정보 로깅]
        - name: 설계와 가독성
          keywords: [거대한 서비스 클래스, 중복 코드, 네이밍, 책임 분리]

